name: Build Pitaka APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "feature/pitaka-home-hierarchy-spending-refactor", "feature/technical-debt-accounting-hardening" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 34
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot
          disable-animations: true
          script: gradle connectedDebugAndroidTest --no-daemon\n\n      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pitaka-debug-apk
          path: app/build/outputs/apk/debug/*.apk
