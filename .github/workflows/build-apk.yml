name: Pitaka Build & Test Gate

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/pitaka-home-hierarchy-spending-refactor"
      - "main"

jobs:
  test-gate:
    name: Unit Test Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 34
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests and compile instrumentation tests
        run: bash ./gradlew testDebugUnitTest assembleDebugAndroidTest --no-daemon

  build:
    name: Build APK
    runs-on: ubuntu-latest
    needs: test-gate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 34
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: bash ./gradlew assembleDebug --no-daemon

      - name: Verify APK artifact
        run: |
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -name "*.apk" -print -quit)
          test -n "$APK"
          test -s "$APK"
          echo "APK: $APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pitaka-debug-apk-${{ github.run_number }}-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
